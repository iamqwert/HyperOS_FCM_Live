name: 问题反馈
description: 推送收不到、模块不生效、界面异常等
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        反馈前请先看一遍 [常见问题](https://github.com/iamqwert/HyperOS_FCM_Live/blob/main/HELP.md#八常见问题) 与 [已知边界](https://github.com/iamqwert/HyperOS_FCM_Live/blob/main/HELP.md#九已知边界)。

        本模块不保活应用、不阻止系统回收，也不修改 GMS 的处理逻辑；这些行为不属缺陷。描述现象时请分清「收不到推送」和「收到得晚」。

  - type: input
    id: device
    attributes:
      label: 机型
      description: 设置「我的设备」里显示的完整名称
      placeholder: REDMI K90 Pro Max
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 系统版本
      description: HyperOS 版本与 Android 版本
      placeholder: HyperOS 4.0.4.0.XPMCNXM / Android 17
    validations:
      required: true

  - type: input
    id: module
    attributes:
      label: 模块版本
      description: 应用「关于」页里的版本号
      placeholder: 4.3.0 (55)
    validations:
      required: true

  - type: input
    id: lsposed
    attributes:
      label: LSPosed 版本
      description: 管理器首页的版本号，API 101 与 102 的热重载行为不同
      placeholder: 1.9.3 (7xxx)
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断文本
      description: |
        应用「记录」页 → 右上角上传图标 → 导出诊断文本，把文件内容整段粘贴到这里。
        它已经包含机型、系统版本、模块版本、钩子装载摘要和最近的事件，比 logcat 截图有用得多。
        如果记录页显示「模块未响应查询」，请直接说明，并附上 `adb logcat -d | grep "HyperFCMLive active in"` 的输出。
      render: text
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从冷启动开始写，注明当时是锁屏、飞行模式、睡眠模式还是刚划掉过应用
      placeholder: |
        1. 手机锁屏放置 30 分钟
        2. 让另一台设备发一条测试推送
        3. 应用无通知，打开后也没有消息
    validations:
      required: true

  - type: dropdown
    id: allowlisted
    attributes:
      label: 目标应用是否已在白名单
      options:
        - 已勾选
        - 未勾选
        - 不确定
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 是否同时装了别的推送/保活模块、是否改过手机管家或省电设置、现象是否只在特定应用出现
    validations:
      required: false

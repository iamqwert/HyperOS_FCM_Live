# 发版流程（2026-10-03 实测）：main 是保护分支，直接 `git push origin main` 会被拒
# （GH006 … Required status check "build" is expected），必须走「分支 → PR → 等 check → 合并 → dispatch」：
#   ① 本地 commit → `git branch release/<ver>`
#   ② 推到远端 —— 见下面「agent 沙箱怎么推」；推完 `git rev-parse origin/main` 核对
#   ③ 开 PR：`gh pr create --repo iamqwert/HyperOS_FCM_Live --base main --head release/<ver>`
#   ④ 轮询 `gh api repos/<o>/<r>/commits/<sha>/check-runs`，等 name == "build" 的 conclusion == success
#   ⑤ `gh pr merge <n> --merge`
#   ⑥ `gh workflow run android.yml --ref main -f publish_release=true`
#
# ## agent 沙箱怎么推（2026-10-04 两次实测，与人工终端不同）
# **`gh` 是有的**（`gh auth status` 已登录 iamqwert，scopes 含 repo/workflow），不要再自己
# 取 token + curl。**`github.com:443` 的 git 通道是间歇故障，不是永久不通**——同一天内
# 19:41 push 成功、20:03~20:05 连败三次（`CONNECT tunnel failed, response 502` /
# `schannel: server closed abruptly`）、20:12 又恢复。`api.github.com` 一直通。
# ⇒ **先试 `git push` 1~2 次，失败再换 REST API 造提交**，不要一上来就只在 API 上想办法：
#   1. 用 Git Data API 把改动做成一个远端提交：
#      `POST /git/blobs`(base64) 逐文件 → `POST /git/trees`{base_tree, tree[]} →
#      `POST /git/commits`{message, tree, parents} → `POST /git/refs`（改写已存在的分支用 PATCH）
#   1b.**造 commit 必须显式传 `author` 与 `committer` 的 name+email**，否则落到 token 持有者的
#      真实邮箱；泄漏后即便 force push 挤掉该提交，它作为 dangling 对象仍可凭 sha 公开读到
#      （HTTP 200），只能联系 GitHub Support 删。
#   2. **文件内容取 `git cat-file blob HEAD:<path>` 的字节，不要读工作树文件**：
#      `core.autocrlf=true`，工作树是 CRLF、仓库里存的是 LF，直传会让整批文件变成 CRLF。
#   3. 删除的文件在 tree 条目里写 `"sha": null`（同一个 tree 调用即可表达增改删）。
#   4. **验收：比对造出来的 tree sha 与 `git rev-parse HEAD^{tree}`**，相等才说明内容逐字节一致。
#      （提交 sha 本来就不会相等 —— API 建的 commit 除非显式传了 author，否则作者身份不同；
#      tree 相等就够了。）
#   5. 沙箱内每个联网命令都要包 `( unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY; … )`；
#      用 Python `urllib` 时同样要先 pop 掉这四个变量，否则会被塞进 `127.0.0.1:64989` 而 502。
#   6. 走 API 造出来的提交与本地同内容的提交 **tree 相同但 sha 不同** ⇒ 本地落后/超前都属正常，
#      等通道恢复后 `git fetch && git reset --soft <远端 head>` 对齐即可。
#      **reset 前务必 `git status`**：`--hard` 会连带抹掉工作树里未提交的改动，它们不在任何
#      commit 里，一旦抹掉只能靠 `git fsck --unreachable` 翻之前 stash 留下的 commit 找回。
#
# origin 指向 fork（iamqwert），不是上游。未经用户点头不提交、不推送。
#
# tag / release name 由 APK 文件名推出（见 release job，tag = v<versionName.versionCode>）；
# 发行说明 = CHANGELOG.md 的 `## <versionName>` 小节 + .github/release-notes.md
# ⇒ 改 CHANGELOG 就等于改发行说明。无 SIGNING_KEY secret 时自动 -PallowDebugSignedRelease（warning 级）。
name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '同时发布 GitHub Release（默认勾选为否，仅构建 CI 产物）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Write key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
          echo storePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> local.properties
          echo keyAlias='${{ secrets.ALIAS }}' >> local.properties
          echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> local.properties
          echo storeFile='key.jks' >> local.properties
          echo ${{ secrets.SIGNING_KEY }} | base64 --decode > key.jks
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        # 没有配签名 secret 时显式声明「允许 debug 签名」，否则发布构建会直接失败
        # （避免产出一个用公开 debug 密钥签名的正式包）。
        # 只编 Release：本模块的 release 包默认就是 debug 签名，可直接装机，
        # 单独的 Debug 变体（未混淆、体积更大）没有分发价值。
        run: |
          export GRADLE_OPTS="-Xmx4g"
          # 判据是「keystore 是否真的写下来了」而不是「secret 是否为空」：
          # pull_request 事件下 Write key 被跳过（条件限 main），若此处只看
          # secret，PR 构建会走正式签名分支却在无 keystore 的 runner 上被
          # 签名守卫拒绝。按文件存在性分流对一切事件类型都成立。
          if [ -f key.jks ] && grep -q "^storeFile=" local.properties; then
            ./gradlew --no-daemon :HyperFCMLive:assembleRelease
          else
            echo "::warning::未配置 SIGNING_KEY，本次产物使用 debug 签名，仅适合内部测试"
            ./gradlew --no-daemon -PallowDebugSignedRelease :HyperFCMLive:assembleRelease
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: hyperos-fcm-live-release
          # mapping.txt rides along because R8 now renames Compose and the Kotlin
          # stdlib (the two package-wide keeps were removed from
          # proguard-rules.pro). Only this module's own classes stay readable, so
          # without the mapping a crash reported from inside Compose is a wall of
          # a/b/c frames. Keep the two in the same artifact so they cannot drift
          # apart.
          path: |
            HyperFCMLive/build/outputs/apk/release/*.apk
            HyperFCMLive/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

  # Formal versioned release (not nightly). Tag/name come from the APK
  # filename built from HyperFCMLive/build.gradle (versionName.versionCode).
  release:
    # 日常 push 只做 CI 构建。发版改为手动触发：Actions → Android CI →
    # Run workflow → 勾选 publish_release。这样误推 main 不会自动发 Release。
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 下面的「Compose release notes from CHANGELOG.md」要读仓库里的 CHANGELOG.md
      # 与 .github/release-notes.md，本 job 又没有别的步骤会拉仓库，所以这次 checkout 不可省略。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release APK
        uses: actions/download-artifact@v8
        with:
          name: hyperos-fcm-live-release
          path: release

      - name: Resolve version from APK name
        id: ver
        run: |
          apk=$(ls release/*.apk | head -1)
          base=$(basename "$apk")
          # e.g. HyperFCMLive-1.5.0-beta2.13-release.apk -> 1.5.0-beta2.13
          ver=${base#HyperFCMLive-}
          ver=${ver%-release.apk}
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v${ver}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${ver} tag=v${ver}"

      - name: Compose release notes from CHANGELOG.md
        # 发行说明直接取 CHANGELOG.md 中当前版本的小节，发版只需维护 CHANGELOG.md。
        run: |
          version="${{ steps.ver.outputs.version }}"   # 例如 2.0.0.19
          name="${version%.*}"                          # 去掉 versionCode 段 -> 2.0.0
          awk -v v="$name" '$0 ~ "^## " v "( |$)" { grab=1; next } grab && /^## / { exit } grab { print }' \
            CHANGELOG.md > section.md || true
          if [ ! -s section.md ]; then
            echo "- 详见仓库 CHANGELOG.md" > section.md
            echo "::warning::CHANGELOG.md 中没有找到 $name 的小节，已使用占位文本"
          fi
          {
            cat section.md
            if [ -f .github/release-notes.md ]; then cat .github/release-notes.md; fi
          } > body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: HyperOS FCM Live ${{ steps.ver.outputs.version }}
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body_path: body.md
          files: |
            release/*.apk
          fail_on_unmatched_files: true

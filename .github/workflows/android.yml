name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Write key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
          echo storePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> local.properties
          echo keyAlias='${{ secrets.ALIAS }}' >> local.properties
          echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> local.properties
          echo storeFile='key.jks' >> local.properties
          echo ${{ secrets.SIGNING_KEY }} | base64 --decode > key.jks
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew --no-daemon :HyperFCMLive:assembleRelease :HyperFCMLive:assembleDebug

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: hyperos-fcm-live-release
          path: HyperFCMLive/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: hyperos-fcm-live-debug
          path: HyperFCMLive/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  nightly-release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: hyperos-fcm-live-release
          path: release

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: hyperos-fcm-live-debug
          path: debug

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: HyperOS FCM Live Nightly
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            LSPosed module builds for HyperOS FCM Live.

            - `*-release.apk` — R8 minified; signed with the release keystore when `SIGNING_KEY` secrets are configured, otherwise debug-signed.
            - `*-debug.apk` — debug build (no minify); debug-signed. Use only for troubleshooting.

            Prefer the **release** APK for daily use. Uninstall first if the signature changes.
          files: |
            release/*.apk
            debug/*.apk
          fail_on_unmatched_files: true

name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Write key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
          echo storePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> local.properties
          echo keyAlias='${{ secrets.ALIAS }}' >> local.properties
          echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> local.properties
          echo storeFile='key.jks' >> local.properties
          echo ${{ secrets.SIGNING_KEY }} | base64 --decode > key.jks
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        # 没有配签名 secret 时显式声明「允许 debug 签名」，否则发布构建会直接失败
        # （避免产出一个用公开 debug 密钥签名的正式包）。
        run: |
          if [ -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo "::warning::未配置 SIGNING_KEY，本次产物使用 debug 签名，仅适合内部测试"
            ./gradlew --no-daemon -PallowDebugSignedRelease :HyperFCMLive:assembleRelease :HyperFCMLive:assembleDebug
          else
            ./gradlew --no-daemon :HyperFCMLive:assembleRelease :HyperFCMLive:assembleDebug
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: hyperos-fcm-live-release
          path: HyperFCMLive/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: hyperos-fcm-live-debug
          path: HyperFCMLive/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # Formal versioned release (not nightly). Tag/name come from the APK
  # filename built from HyperFCMLive/build.gradle (versionName.versionCode).
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 下面的「Compose release notes from CHANGELOG.md」要读仓库里的 CHANGELOG.md
      # 与 .github/release-notes.md，本 job 又没有别的步骤会拉仓库，所以这次 checkout 不可省略。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: hyperos-fcm-live-release
          path: release

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: hyperos-fcm-live-debug
          path: debug

      - name: Resolve version from APK name
        id: ver
        run: |
          apk=$(ls release/*.apk | head -1)
          base=$(basename "$apk")
          # e.g. HyperFCMLive-1.5.0-beta2.13-release.apk -> 1.5.0-beta2.13
          ver=${base#HyperFCMLive-}
          ver=${ver%-release.apk}
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v${ver}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${ver} tag=v${ver}"

      - name: Compose release notes from CHANGELOG.md
        # 发行说明直接取 CHANGELOG.md 中当前版本的小节，发版只需维护 CHANGELOG.md。
        run: |
          version="${{ steps.ver.outputs.version }}"   # 例如 2.0.0.19
          name="${version%.*}"                          # 去掉 versionCode 段 -> 2.0.0
          awk -v v="$name" '$0 ~ "^## " v "( |$)" { grab=1; next } grab && /^## / { exit } grab { print }' \
            CHANGELOG.md > section.md || true
          if [ ! -s section.md ]; then
            echo "- 详见仓库 CHANGELOG.md" > section.md
            echo "::warning::CHANGELOG.md 中没有找到 $name 的小节，已使用占位文本"
          fi
          {
            echo "## 更新内容 / Changelog"
            echo
            cat section.md
            echo
            echo "## 发布与版本"
            echo "- \`versionName\`：\`$version\`（tag \`v$version\`）"
            echo "- 正式 Release（非 nightly），同时提供 **release** 与 **debug** 两个 APK。"
            echo "- Release APK：R8 混淆；配置 GitHub Secrets 后使用发布签名。"
            echo
            if [ -f .github/release-notes.md ]; then cat .github/release-notes.md; fi
          } > body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: HyperOS FCM Live ${{ steps.ver.outputs.version }}
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body_path: body.md
          files: |
            release/*.apk
            debug/*.apk
          fail_on_unmatched_files: true

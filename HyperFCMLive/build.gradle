// Build facts that are easy to lose and expensive to rediscover:
//
// - Release APK (debug-signed, directly installable):
//     ./gradlew --no-daemon -PallowDebugSignedRelease :HyperFCMLive:assembleRelease
//     adb install -r HyperFCMLive/build/outputs/apk/release/*.apk
//   Without -PallowDebugSignedRelease a real keystore in local.properties is
//   required — the guard at the bottom of this file refuses to sign a release
//   with the public debug key (anyone can sign with it and install over us).
// - A code change only counts as done after rebuilding and `adb install -r`:
//   the module hot-reloads, and the run-id changing in the log is what proves
//   the new code is the code running. Markdown-only changes need no rebuild.
// - AGP resource merging is sticky. After renaming or deleting a res directory
//   or a qualifier, clear the intermediates before rebuilding or the old names
//   keep resolving: merged_res, packaged_res, incremental/*/{merge,package}*
//   Resources, compile_and_runtime_r_class_jar, *_symbol_list,
//   merged_res_blame_folder.
// - Deleting a drawable: remove the *attribute* first, then the colour. The
//   other order leaves a dangling reference and AAPT2 fails with
//   "resource color/X not found".
// - res/xml/data_extraction_rules.xml must stay explicitly declared.
// - Forensics trap: aapt output shortens resource paths (e.g. res/FK.xml), so
//   `xmltree` reports "not found" for them — match on
//   `^resource 0x… (type)/name$` instead of on the path.

plugins {
    id 'com.android.application'
    // Standalone KGP 2.4.20 — AGP's built-in Kotlin is opted out, see
    // gradle.properties for the POM-verified reason.
    id 'org.jetbrains.kotlin.android'
    // nav/Route.kt's keys: the back stack is saved by serializing it.
    id 'org.jetbrains.kotlin.plugin.serialization'
    // Compose compiler: must match the KGP version exactly, so it moves with it.
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.20'
}

kotlin {
    compilerOptions {
        // Built-in Kotlin used to inherit this from android.compileOptions; the
        // standalone KGP defaults jvmTarget to 1.8, so pin the module's level.
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
    }
}

// Signing keys live outside the repository (local.properties is gitignored).
// Hoisted out of the android block so the release guard at the end of this file
// can see it too.
Properties localProperties = new Properties()
if (project.rootProject.file('local.properties').exists()) {
    localProperties.load(project.rootProject.file('local.properties').newDataInputStream())
}

android {
    compileSdk 37

    defaultConfig {
        applicationId namespace
        // HyperOS 3 (and 4) devices ship Android 15 at the very least, so the
        // module targets them directly: everything below API 35 is dropped, and
        // with it the whole pre-edge-to-edge window handling path.
        minSdkVersion 35
        targetSdkVersion 37
        // Fixed (bumped by hand each release) so LSPosed update checks never treat
        // this fork as older than upstream builds that inherit a low jgit commitCount.
        versionCode 53
        versionName "4.1.1"

        // HyperOS modules ship arm64 only; drop armv7a / x86 / x86_64 natives.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        if (localProperties.getProperty("storeFile") != null) {
            config {
                storeFile project.rootProject.file(localProperties.getProperty("storeFile"))
                storePassword localProperties.getProperty("storePassword")
                keyAlias localProperties.getProperty("keyAlias")
                keyPassword localProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            if (localProperties.getProperty("storeFile") != null) {
                signingConfig signingConfigs.config
            }
        }
        release {
            if (localProperties.getProperty("storeFile") != null) {
                signingConfig signingConfigs.config
            } else if (project.hasProperty("allowDebugSignedRelease")) {
                // Local/CI opt-in only: sign with the public debug keystore so the
                // APK can still be installed and inspected. Never ship this build.
                signingConfig signingConfigs.debug
            }
            // No silent debug fallback: the AOSP debug keystore is public, so a
            // release signed with it can be impersonated — anyone can sign an APK
            // with the same signature and it installs over this one as an update.
            // Which is refused, loudly, by the guard at the end of this file.
            minifyEnabled true
            // Resource shrink often drops values only referenced from code
            // (e.g. getColor) and can break Release-only inflation.
            shrinkResources false
            proguardFiles 'proguard-rules.pro'
            vcsInfo.include false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        compose = true
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    packagingOptions {
        resources {
            excludes += ['kotlin/**', 'META-INF/androidx/**']
        }
    }

    lint {
        checkReleaseBuilds false
    }

    namespace 'io.github.howard20181.hyperos.fcmlive'
}

base {
    archivesName = project.name + "-" + android.defaultConfig.versionName + "." + android.defaultConfig.versionCode
}

dependencies {
    // The base of the theme chain, and the only reason it is here: the parent
    // named in res/values/themes.xml is Theme.Material3.DayNight.NoActionBar,
    // which descends from Theme.MaterialComponents.*, which descends from
    // Theme.AppCompat.*. No source file references it directly.
    implementation 'androidx.appcompat:appcompat:1.8.0'
    // Declared for the ActivityResultContracts imports: CreateDocument and
    // OpenDocument in AboutDelegate (allowlist export / import) and
    // RequestPermission in MainActivity (the diagnostics log).
    //
    // 1.13.0, not 1.8.2, and that is a hard floor now: Miuix's overlay popups
    // register their back handlers through NavigationEventDispatcherOwner, and it
    // is ComponentActivity 1.13 that sets that owner on the decor view (and on
    // every ComponentDialog's). With 1.8.2 the owner is never installed, and
    // opening the home overflow under the Miuix look crashed with "No
    // NavigationEventDispatcher was provided via LocalNavigationEventDispatcherOwner"
    // — verified on device, and verified against 1.13.0's own sources, where
    // ComponentActivity.onCreate does window.decorView.setViewTree...(this).
    implementation 'androidx.activity:activity:1.13.0'
    // Compose entry points for the Activities (setContent). Same version line as
    // `activity` above: the Compose integration and the core artifact are
    // versioned together, and declaring the pair keeps Dependabot moving them as
    // one.
    implementation 'androidx.activity:activity-compose:1.13.0'
    // What Miuix's popups register their back handlers through, and the channel
    // NavDisplay reads the system's back gesture from. Declared so Dependabot
    // sees it: miuix 0.9.4 — the version this module and KernelSU's manager both
    // run — asks for the 1.1.x line, resolved here at 1.2.0.
    implementation 'androidx.navigationevent:navigationevent-compose:1.2.0'
    // Lifecycle: the direct consumer is ui/BgEffect.kt — `Lifecycle.currentStateFlow`,
    // read to hold the background mesh unless the page it belongs to is RESUMED
    // (every page is an entry of one NavDisplay, and a covered entry's lifecycle is
    // capped at STARTED). It used to arrive transitively at 2.10.0 behind activity
    // and compose; pinned at 2.11.0 here so the resolved version is declared rather
    // than inherited. 2.11.0 needs Compose UI 1.7.0+ for LocalLifecycleOwner
    // (comfortably satisfied — the BOM alone pins 1.12.1) and is built against
    // compileSdk 37 (AGP 9.2.0+ floor — we have 9.4.1).
    implementation 'androidx.lifecycle:lifecycle-runtime-android:2.11.0'
    // Material Views: two real consumers keep this here — the
    // `Theme.Material3.DayNight.NoActionBar` parent the app theme inherits from,
    // and DynamicColors (wallpaper accent) in theme/ThemeSupport.kt. The
    // inflation-time role painter that used to come with it is gone: there is no
    // XML left to inflate.
    implementation 'com.google.android.material:material:1.14.0'
    // Jetpack Compose (View-compatible). Theme bridge lives in theme/ComposeTheme.kt.
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    // `ui` is the KMP root artifact: it resolves to ui-android, so declaring
    // ui-android as well was the same module twice.
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    // Pinned above what composeBom 2026.09.00 resolves (1.4.0): 1.4.0 ships
    // every Expressive component — LoadingIndicator, SplitButton, ButtonGroup,
    // FloatingToolbar, MaterialShapes, MotionScheme.expressive() — but declares
    // them Kotlin-internal, so none of it compiles against. 1.5.0-alpha is the
    // first line that exposes them. Verified: compiles, and passes R8 release.
    implementation 'androidx.compose.material3:material3:1.5.0-beta01'
    // Icons are drawables under res/drawable (Material Symbols, see the red
    // line at the top of theme/ComposeTokens.kt), so the compose icon packs are
    // not needed at all — not even the core one. material3 stopped pulling them
    // in transitively at 1.4.0, and nothing here references `Icons.*` any more.
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    // Miuix (compose-miuix-ui) — the theme behind 界面风格 = Miuix.
    //
    // 0.9.1 was a hard ceiling for toolchain reasons alone: AGP's built-in
    // Kotlin (2.2.10) read binary metadata only up to 2.3.0 and Miuix moved to
    // Kotlin 2.4.0 at 0.9.2. Since 2026-10-15 the module compiles with the
    // standalone KGP 2.4.20 (see gradle.properties for why the built-in/DSL
    // opt-out pair stays until AGP's built-in Kotlin reaches 2.4), which lifts
    // the ceiling; 0.9.4 builds with Kotlin 2.4.20 / Compose Multiplatform
    // 1.12.0 — both match this module exactly.
    //
    // 0.9.2 → 0.9.4 breaking changes audited against our usage surface, none
    // hit: `miuix-navigation3-ui` removal (never used), RadioButtonPreference
    // color-signature consolidation (not used), NavigationRail overload split
    // (not used), miuix-blur minSdk 33 / miuix-shader extraction (miuix-blur is
    // used now — the floating bottom bar, see ui/MiuixFloatingBar.kt),
    // shared minSdk 23 → 24 (this module is minSdk 35 — HyperOS 3/4 only).
    // Additive bits we get for free: dialog `maxWidth`/`largeScreen`/
    // `cornerRadius` (note: centered dialogs now default to a FIXED 32dp
    // corner instead of inheriting the screen corner — a look change to
    // verify on device), Slider/RangeSliderPreference, TopAppBar refactored
    // onto the androidx-main base.
    //
    // The preference package is the same files as 0.9.1 plus the sliders, so
    // the docs at compose-miuix-ui.github.io still describe the classpath. As
    // before, 0.9.4 publishes the leaf rows but no public base Preference
    // container — a row that is neither a switch nor an arrow is still
    // composed from Miuix's basic parts.
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.4'
    // The library's own icon set, used for the overflow glyph so the bar speaks
    // one icon language per look. Independent of miuix-ui, same version line.
    implementation 'top.yukonga.miuix.kmp:miuix-icons-android:0.9.4'
    // The liquid glass behind the Miuix look's floating bottom bar (an opt-in
    // variant, off by default — see ui/MiuixFloatingBar.kt). Pulls miuix-shader
    // for the SDF lens shader. RenderEffect paths need API 31; this module is
    // minSdk 35.
    implementation 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.4'
    // The blurred title-bar glass. Haze over miuix-blur, after four device
    // rounds: miuix-blur's progressive blur ramps the RADIUS from full to zero,
    // and that ramp necessarily crosses the mid range (10-30dp) that smears
    // dark glyphs into grey pills (the "stain" reports), while its kernel also
    // samples past the bar's bottom edge (the light strip under the search
    // capsule, the pull-refresh indicator smeared into a column). Haze blurs
    // at a CONSTANT radius and fades with an alpha mask (HazeProgressive), so
    // a half-masked region shows the already-homogenized wash at partial alpha
    // over sharp content — no half-blurred state exists to read as dirt, and
    // the mask covers the tints too, so the scrim fades on the same ramp.
    // RenderEffect paths need API 31; this module is minSdk 35.
    implementation 'dev.chrisbanes.haze:haze:2.0.1'
    implementation 'dev.chrisbanes.haze:haze-blur:2.0.1'
    // The navigation runtime the pages now run through: one Activity holding one
    // `NavDisplay`, every page an entry in its back stack.
    //
    // The module dropped this artifact once, when the only thing it offered was
    // `Modifier.navSwipeDismiss` — an app-level swipe gesture layered over the
    // platform's own edge swipe, which the platform's predictive-back stream
    // already drives on its own. The pages are still driven by that stream alone
    // (no route here declares a `swipeDismiss` direction); what brings the
    // artifact back is the rest of it. Sub-pages used to be separate Activities,
    // and a covered Activity is STOPPED: returning to it cost a whole first
    // frame, and the reveal showed a photograph of it rather than the page.
    // NavDisplay keeps every layer below the top composed, laid out and drawn, so
    // the gesture and the settle after it move what is already there.
    implementation 'top.yukonga.miuix.kmp:miuix-nav-android:0.9.4'
    // `@Serializable` route keys, and `rememberNavBackStack`'s saver, which is
    // the library's own line for it. The compiler plugin is declared in the root
    // build and applied above; this is the runtime half.
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    // Compile-time hidden-API signatures (not packaged in the APK).
    compileOnly project(":hiddenapi:stubs")
    // Coroutines: UpdateChecker's network check runs on Dispatchers.IO through a
    // scope (was a raw Thread), and the Compose side's rememberCoroutineScope /
    // LaunchedEffect land on the same artifacts. The Compose BOM resolves these
    // transitively already; declared here so the version the module compiles
    // against is pinned in this file rather than inherited by accident.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    // JVM unit tests (no device / ADB). Release 3.5.3 dropped this line while
    // keeping src/test, which left both test classes importing org.junit with no
    // provider on the classpath: `:HyperFCMLive:testDebugUnitTest` did not even
    // compile, so the MCU colour-port golden checks and the version-comparison
    // cases stopped running without anything failing. Test scope only — it is not
    // on releaseRuntimeClasspath and ships nothing.
    testImplementation 'junit:junit:4.13.2'
}

// Refuse to produce a release artifact without a real keystore. The AOSP debug
// keystore is public, so a release signed with it can be impersonated: anyone can
// sign an APK with the same signature and it installs over this one as an update.
// The check runs when a release is actually built (not at configuration time), so
// debug builds and plain `gradle tasks` still work on machines without keys.
// CI without signing secrets opts in explicitly with -PallowDebugSignedRelease
// (it also prints a warning there) instead of silently shipping a debug-signed APK.
tasks.matching { it.name in ["assembleRelease", "bundleRelease", "packageRelease"] }
        .configureEach {
            doFirst {
                if (localProperties.getProperty("storeFile") == null
                        && !project.hasProperty("allowDebugSignedRelease")) {
                    throw new GradleException(
                            "Release signing is not configured. Add storeFile, " +
                            "storePassword, keyAlias and keyPassword to " +
                            "local.properties; refusing to sign a release with the " +
                            "public debug key. (Pass -PallowDebugSignedRelease to " +
                            "override on purpose.)")
                }
            }
        }

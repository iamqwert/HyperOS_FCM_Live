plugins {
    id 'com.android.application'
    // Compose compiler for Kotlin 2.2.10 (matches the stdlib already on the classpath).
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10'
}

// Signing keys live outside the repository (local.properties is gitignored).
// Hoisted out of the android block so the release guard at the end of this file
// can see it too.
Properties localProperties = new Properties()
if (project.rootProject.file('local.properties').exists()) {
    localProperties.load(project.rootProject.file('local.properties').newDataInputStream())
}

android {
    compileSdk 37

    defaultConfig {
        applicationId namespace
        // HyperOS 3 (and 4) devices ship Android 15 at the very least, so the
        // module targets them directly: everything below API 35 is dropped, and
        // with it the whole pre-edge-to-edge window handling path.
        minSdkVersion 35
        targetSdkVersion 37
        // Fixed (bumped by hand each release) so LSPosed update checks never treat
        // this fork as older than upstream builds that inherit a low jgit commitCount.
        versionCode 36
        versionName "3.5.1"

        // HyperOS modules ship arm64 only; drop armv7a / x86 / x86_64 natives.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        if (localProperties.getProperty("storeFile") != null) {
            config {
                storeFile project.rootProject.file(localProperties.getProperty("storeFile"))
                storePassword localProperties.getProperty("storePassword")
                keyAlias localProperties.getProperty("keyAlias")
                keyPassword localProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            if (localProperties.getProperty("storeFile") != null) {
                signingConfig signingConfigs.config
            }
        }
        release {
            if (localProperties.getProperty("storeFile") != null) {
                signingConfig signingConfigs.config
            } else if (project.hasProperty("allowDebugSignedRelease")) {
                // Local/CI opt-in only: sign with the public debug keystore so the
                // APK can still be installed and inspected. Never ship this build.
                signingConfig signingConfigs.debug
            }
            // No silent debug fallback: the AOSP debug keystore is public, so a
            // release signed with it can be impersonated — anyone can sign an APK
            // with the same signature and it installs over this one as an update.
            // Which is refused, loudly, by the guard at the end of this file.
            minifyEnabled true
            // Resource shrink often drops values only referenced from code
            // (e.g. getColor) and can break Release-only inflation.
            shrinkResources false
            proguardFiles 'proguard-rules.pro'
            vcsInfo.include false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        compose = true
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    packagingOptions {
        resources {
            excludes += ['kotlin/**', 'META-INF/androidx/**']
        }
    }

    lint {
        checkReleaseBuilds false
    }

    dependenciesInfo.includeInApk false
    namespace 'io.github.howard20181.hyperos.fcmlive'
}

base {
    archivesName = project.name + "-" + android.defaultConfig.versionName + "." + android.defaultConfig.versionCode
}

dependencies {
    // Compile-time only: annotations used by the source; nothing is packaged.
    compileOnly 'androidx.annotation:annotation:1.11.0'
    // Material Design 3 components, theme, typography and shape tokens.
    implementation 'androidx.appcompat:appcompat:1.8.0'
    // 1.13.0+ is required for LoadingIndicator (M3 Expressive), which drives
    // the pull-to-refresh spinner.
    implementation 'com.google.android.material:material:1.14.0'
    // Jetpack Compose (View-compatible). Theme bridge lives in theme/ComposeTheme.kt.
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-android'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    // Standard Material/Android pull-to-refresh (SwipeRefreshLayout).
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    // Compile-time hidden-API signatures (not packaged in the APK).
    compileOnly project(":hiddenapi:stubs")

    // JVM unit tests (no device / ADB).
    testImplementation 'junit:junit:4.13.2'
}

// Refuse to produce a release artifact without a real keystore. The AOSP debug
// keystore is public, so a release signed with it can be impersonated: anyone can
// sign an APK with the same signature and it installs over this one as an update.
// The check runs when a release is actually built (not at configuration time), so
// debug builds and plain `gradle tasks` still work on machines without keys.
// CI without signing secrets opts in explicitly with -PallowDebugSignedRelease
// (it also prints a warning there) instead of silently shipping a debug-signed APK.
tasks.matching { it.name in ["assembleRelease", "bundleRelease", "packageRelease"] }
        .configureEach {
            doFirst {
                if (localProperties.getProperty("storeFile") == null
                        && !project.hasProperty("allowDebugSignedRelease")) {
                    throw new GradleException(
                            "Release signing is not configured. Add storeFile, " +
                            "storePassword, keyAlias and keyPassword to " +
                            "local.properties; refusing to sign a release with the " +
                            "public debug key. (Pass -PallowDebugSignedRelease to " +
                            "override on purpose.)")
                }
            }
        }

# Compose + R8 need a larger daemon heap on CI (OutOfMemoryError during
# minifyReleaseWithR8 / mergeExtDexDebug on GitHub runners).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Kotlin 2.4.20 can only arrive as the standalone Kotlin Gradle Plugin: AGP's
# built-in Kotlin is pinned to KGP 2.2.10 — POM-verified against 9.4.1 AND
# 9.5.0-alpha09 (dl.google.com …/com/android/tools/build/gradle/*/gradle-*.pom,
# dependency org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10) — and a 2.2.x
# compiler reads binary metadata only up to 2.3.0, so every library built with
# Kotlin 2.4.x (Miuix 0.9.2+) fails with "Class 'kotlin.Unit' was compiled with
# an incompatible version of Kotlin". Opting out of built-in Kotlin also
# requires the legacy DSL: kotlin-android is incompatible with the new DSL
# (that missing second flag is what made the bare android.builtInKotlin=false
# attempt die on an ApplicationExtension cast before). Both flags are removed
# in AGP 10 — drop this pair, the two plugin ids and the pinned jvmTarget the
# moment AGP's built-in Kotlin reaches 2.4.
android.builtInKotlin=false
android.newDsl=false
